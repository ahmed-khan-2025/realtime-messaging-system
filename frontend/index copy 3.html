<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Real-Time Messaging System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        .users {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input,
        select,
        button {
            font-size: 15px;
            padding: 10px;
            border-radius: 6px;
        }

        input,
        select {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        button.secondary {
            background: #6b7280;
        }

        button.secondary:hover {
            background: #4b5563;
        }

        button.danger {
            background: #dc2626;
        }

        button.danger:hover {
            background: #b91c1c;
        }

        button.register {
            background: #059669;
        }

        button.register:hover {
            background: #047857;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .button-row button {
            flex: 1;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 6px;
            font-size: 14px;
        }

        .status.connected {
            background: #dcfce7;
            color: #166534;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .room-section {
            margin-bottom: 25px;
        }

        .room-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .room-controls select {
            flex: 1;
            min-width: 250px;
        }

        .create-room {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .create-room input {
            flex: 1;
        }

        .chat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: white;
            border: 1px solid #eee;
        }

        .message strong {
            margin-right: 5px;
        }

        .message-input {
            display: flex;
            gap: 10px;
        }

        .message-input input {
            flex: 1;
        }

        .message-input button {
            min-width: 100px;
        }

        .login-only {
            display: block;
        }

        .logged-in-only {
            display: none;
        }

        .registration-message {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        .room-info {
            margin-top: 10px;
            font-weight: bold;
        }

        .small-text {
            font-size: 13px;
            color: #666;
        }

        .server-status {
            margin-bottom: 20px;
            padding: 10px 15px;
            border-radius: 6px;
            background: #f3f4f6;
            font-size: 14px;
        }

        .server-status.online {
            background: #dcfce7;
            color: #166534;
        }

        .server-status.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {

            .users {
                grid-template-columns: 1fr;
            }

            .message-input {
                flex-direction: column;
            }

            .create-room {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <h1>Real-Time Messaging System</h1>


    <!-- ===================================================== -->
    <!-- SERVER STATUS -->
    <!-- ===================================================== -->

    <div
        id="serverStatus"
        class="server-status"
    >
        Checking server connection...
    </div>


    <!-- ===================================================== -->
    <!-- USERS -->
    <!-- ===================================================== -->

    <div class="users">


        <!-- ================================================= -->
        <!-- USER 1 -->
        <!-- ================================================= -->

        <div class="card">

            <h2>User 1</h2>


            <!-- LOGIN VIEW -->

            <div
                id="loginView1"
                class="login-only"
            >

                <div class="login-form">

                    <label for="username1">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username1"
                        placeholder="Enter username"
                        autocomplete="username"
                    >


                    <label for="password1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password1"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >


                    <div class="button-row">

                        <button
                            type="button"
                            onclick="loginUser(1)"
                        >
                            Login
                        </button>


                        <button
                            type="button"
                            class="register"
                            onclick="registerUser(1)"
                        >
                            Register
                        </button>

                    </div>


                    <div
                        id="registrationMessage1"
                        class="registration-message"
                    ></div>

                </div>

            </div>


            <!-- LOGGED-IN VIEW -->

            <div
                id="loggedInView1"
                class="logged-in-only"
            >

                <p>
                    <strong>Username:</strong>
                    <span id="loggedUsername1"></span>
                </p>


                <p>
                    <strong>Database ID:</strong>
                    <span id="userId1"></span>
                </p>


                <div
                    id="status1"
                    class="status"
                >
                    Not connected
                </div>


                <br>


                <button
                    type="button"
                    class="danger"
                    onclick="logoutUser(1)"
                >
                    Logout
                </button>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- USER 2 -->
        <!-- ================================================= -->

        <div class="card">

            <h2>User 2</h2>


            <!-- LOGIN VIEW -->

            <div
                id="loginView2"
                class="login-only"
            >

                <div class="login-form">

                    <label for="username2">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username2"
                        placeholder="Enter username"
                        autocomplete="username"
                    >


                    <label for="password2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password2"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >


                    <div class="button-row">

                        <button
                            type="button"
                            onclick="loginUser(2)"
                        >
                            Login
                        </button>


                        <button
                            type="button"
                            class="register"
                            onclick="registerUser(2)"
                        >
                            Register
                        </button>

                    </div>


                    <div
                        id="registrationMessage2"
                        class="registration-message"
                    ></div>

                </div>

            </div>


            <!-- LOGGED-IN VIEW -->

            <div
                id="loggedInView2"
                class="logged-in-only"
            >

                <p>
                    <strong>Username:</strong>
                    <span id="loggedUsername2"></span>
                </p>


                <p>
                    <strong>Database ID:</strong>
                    <span id="userId2"></span>
                </p>


                <div
                    id="status2"
                    class="status"
                >
                    Not connected
                </div>


                <br>


                <button
                    type="button"
                    class="danger"
                    onclick="logoutUser(2)"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- ROOMS -->
    <!-- ===================================================== -->

    <div class="card room-section">

        <h2>Rooms</h2>


        <div class="room-controls">

            <label for="roomSelect">
                Current room:
            </label>


            <select
                id="roomSelect"
                onchange="changeRoom()"
            >

                <option value="">
                    No room selected
                </option>

            </select>


            <button
                type="button"
                class="secondary"
                onclick="refreshRooms()"
            >
                Refresh Rooms
            </button>

        </div>


        <!-- CREATE ROOM -->

        <div class="create-room">

            <input
                type="text"
                id="newRoomName"
                placeholder="Enter new room name"
            >


            <button
                type="button"
                onclick="createRoom()"
            >
                Create Room
            </button>

        </div>


        <div
            id="roomInfo"
            class="room-info"
        >
            No room selected
        </div>

    </div>


    <!-- ===================================================== -->
    <!-- CHAT -->
    <!-- ===================================================== -->

    <div class="chat-card">

        <h2>Chat</h2>


        <div id="messages"></div>


        <div class="message-input">

            <select id="sendAsUser">

                <option value="">
                    Send as...
                </option>

            </select>


            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                maxlength="2000"
                onkeydown="handleMessageKey(event)"
            >


            <button
                type="button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>


// =============================================================
// API CONFIGURATION
// =============================================================

const API_BASE_URL = "http://127.0.0.1:8000";


// =============================================================
// STATE
// =============================================================

const users = {

    1: {
        token: null,
        userId: null,
        username: null,
        websocket: null
    },

    2: {
        token: null,
        userId: null,
        username: null,
        websocket: null
    }

};


let currentRoomId = null;


// Prevent duplicate messages when both WebSockets
// receive the same Redis broadcast.

const displayedMessages = new Set();


// =============================================================
// API REQUEST HELPER
// =============================================================

async function apiRequest(
    endpoint,
    options = {}
) {

    const url =
        `${API_BASE_URL}${endpoint}`;

    console.log(
        `${options.method || "GET"} ${url}`
    );

    try {

        const response =
            await fetch(
                url,
                options
            );

        const text =
            await response.text();

        let data = null;

        if (text) {

            try {

                data =
                    JSON.parse(text);

            } catch {

                data = {
                    detail: text
                };

            }

        }

        return {
            response,
            data
        };

    } catch (error) {

        console.error(
            "API connection error:",
            error
        );

        throw error;
    }

}


// =============================================================
// JWT DECODER
// =============================================================

function decodeJWT(token) {

    try {

        const payload =
            token.split(".")[1];


        const decoded =
            atob(
                payload
                    .replace(/-/g, "+")
                    .replace(/_/g, "/")
            );


        return JSON.parse(decoded);

    } catch (error) {

        console.error(
            "JWT decode error:",
            error
        );

        return null;
    }

}


// =============================================================
// SERVER HEALTH CHECK
// =============================================================

async function checkServerConnection() {

    const status =
        document.getElementById(
            "serverStatus"
        );

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/docs`,
                {
                    method: "GET"
                }
            );


        if (response.ok) {

            status.textContent =
                "Server connected: FastAPI is running";

            status.className =
                "server-status online";

        } else {

            status.textContent =
                `Server responded with HTTP ${response.status}`;

            status.className =
                "server-status offline";
        }

    } catch (error) {

        console.error(
            "Server health check failed:",
            error
        );

        status.textContent =
            "Cannot connect to FastAPI. Make sure Uvicorn is running on http://127.0.0.1:8000";

        status.className =
            "server-status offline";
    }

}


// =============================================================
// LOGIN
// =============================================================

async function loginUser(userNumber) {

    const username =
        document
            .getElementById(
                `username${userNumber}`
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                `password${userNumber}`
            )
            .value;


    if (!username || !password) {

        alert(
            "Username and password are required."
        );

        return;
    }


    try {

        const {
            response,
            data
        } = await apiRequest(
            "/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        if (!response.ok) {

            alert(
                data?.detail ||
                "Invalid username or password."
            );

            return;
        }


        const token =
            data?.access_token;


        if (!token) {

            alert(
                "Login succeeded but no access token was returned."
            );

            return;
        }


        const payload =
            decodeJWT(token);


        if (!payload || !payload.sub) {

            alert(
                "Invalid authentication token."
            );

            return;
        }


        // -----------------------------------------------------
        // Save user state
        // -----------------------------------------------------

        users[userNumber].token =
            token;

        users[userNumber].userId =
            Number(payload.sub);

        users[userNumber].username =
            username;


        showLoggedInView(
            userNumber
        );


        updateSendUserOptions();


        console.log(
            `User ${userNumber} logged in.`,
            users[userNumber]
        );


        // -----------------------------------------------------
        // Load rooms
        // -----------------------------------------------------

        await refreshRooms();

    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        alert(
            `Unable to connect to the server.\n\n${error.message}`
        );
    }

}


// =============================================================
// REGISTER
// =============================================================

async function registerUser(userNumber) {

    const username =
        document
            .getElementById(
                `username${userNumber}`
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                `password${userNumber}`
            )
            .value;


    if (!username || !password) {

        showRegistrationMessage(
            userNumber,
            "Username and password are required.",
            true
        );

        return;
    }


    if (password.length < 6) {

        showRegistrationMessage(
            userNumber,
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    try {

        console.log(
            `Registering User ${userNumber}: ${username}`
        );


        const {
            response,
            data
        } = await apiRequest(
            "/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        console.log(
            "Registration response:",
            response.status,
            data
        );


        if (!response.ok) {

            showRegistrationMessage(
                userNumber,
                data?.detail ||
                "Registration failed.",
                true
            );

            return;
        }


        /*
         * Backend returns JWT immediately
         * after successful registration.
         */

        const token =
            data?.access_token;


        if (!token) {

            showRegistrationMessage(
                userNumber,
                "Registration succeeded, but no access token was returned.",
                true
            );

            return;
        }


        const payload =
            decodeJWT(token);


        if (!payload || !payload.sub) {

            showRegistrationMessage(
                userNumber,
                "Registration succeeded, but the authentication token is invalid.",
                true
            );

            return;
        }


        // -----------------------------------------------------
        // Automatically log in registered user
        // -----------------------------------------------------

        users[userNumber].token =
            token;

        users[userNumber].userId =
            Number(payload.sub);

        users[userNumber].username =
            username;


        showLoggedInView(
            userNumber
        );


        updateSendUserOptions();


        showRegistrationMessage(
            userNumber,
            `Registration successful. Logged in as ${username}.`,
            false
        );


        console.log(
            `User ${userNumber} registered successfully.`,
            {
                username: username,
                userId:
                    users[userNumber].userId
            }
        );


        // -----------------------------------------------------
        // Load rooms
        // -----------------------------------------------------

        await refreshRooms();

    } catch (error) {

        console.error(
            "Registration error:",
            error
        );


        showRegistrationMessage(
            userNumber,
            `Connection error: ${error.message}`,
            true
        );
    }

}


// =============================================================
// SHOW LOGGED-IN VIEW
// =============================================================

function showLoggedInView(
    userNumber
) {

    document
        .getElementById(
            `loggedUsername${userNumber}`
        )
        .textContent =
        users[userNumber].username;


    document
        .getElementById(
            `userId${userNumber}`
        )
        .textContent =
        users[userNumber].userId;


    document
        .getElementById(
            `loginView${userNumber}`
        )
        .style.display =
        "none";


    document
        .getElementById(
            `loggedInView${userNumber}`
        )
        .style.display =
        "block";


    const status =
        document.getElementById(
            `status${userNumber}`
        );


    status.textContent =
        "Logged in - no room connected";


    status.className =
        "status";


    console.log(
        `User ${userNumber} UI updated.`
    );

}


// =============================================================
// REGISTRATION MESSAGE
// =============================================================

function showRegistrationMessage(
    userNumber,
    message,
    isError
) {

    const element =
        document.getElementById(
            `registrationMessage${userNumber}`
        );


    element.textContent =
        message;


    if (isError) {

        element.style.color =
            "#b91c1c";

    } else {

        element.style.color =
            "#047857";
    }

}


// =============================================================
// LOGOUT
// =============================================================

function logoutUser(
    userNumber
) {

    const user =
        users[userNumber];


    // ---------------------------------------------------------
    // Close WebSocket
    // ---------------------------------------------------------

    if (user.websocket) {

        try {

            user.websocket.close();

        } catch (error) {

            console.error(
                error
            );
        }

        user.websocket = null;
    }


    // ---------------------------------------------------------
    // Clear state
    // ---------------------------------------------------------

    user.token = null;
    user.userId = null;
    user.username = null;


    // ---------------------------------------------------------
    // Reset UI
    // ---------------------------------------------------------

    document
        .getElementById(
            `loggedUsername${userNumber}`
        )
        .textContent = "";


    document
        .getElementById(
            `userId${userNumber}`
        )
        .textContent = "";


    document
        .getElementById(
            `loggedInView${userNumber}`
        )
        .style.display =
        "none";


    document
        .getElementById(
            `loginView${userNumber}`
        )
        .style.display =
        "block";


    document
        .getElementById(
            `password${userNumber}`
        )
        .value = "";


    document
        .getElementById(
            `registrationMessage${userNumber}`
        )
        .textContent = "";


    const status =
        document.getElementById(
            `status${userNumber}`
        );


    status.textContent =
        "Not connected";

    status.className =
        "status";


    updateSendUserOptions();


    // ---------------------------------------------------------
    // Clear visible chat
    // ---------------------------------------------------------

    document
        .getElementById(
            "messages"
        )
        .innerHTML = "";


    displayedMessages.clear();


    console.log(
        `User ${userNumber} logged out.`
    );

}


// =============================================================
// UPDATE SEND-AS OPTIONS
// =============================================================

function updateSendUserOptions() {

    const select =
        document.getElementById(
            "sendAsUser"
        );


    const selectedValue =
        select.value;


    select.innerHTML = `
        <option value="">
            Send as...
        </option>
    `;


    for (
        const userNumber of [1, 2]
    ) {

        const user =
            users[userNumber];


        if (user.token) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                userNumber;


            option.textContent =
                `User ${userNumber} (${user.username})`;


            select.appendChild(
                option
            );
        }

    }


    if (
        [...select.options].some(
            option =>
                option.value ===
                selectedValue
        )
    ) {

        select.value =
            selectedValue;
    }

}


// =============================================================
// REFRESH ROOMS
// =============================================================

async function refreshRooms() {

    const loggedInUser =
        getFirstLoggedInUser();


    if (!loggedInUser) {

        console.log(
            "No logged-in user."
        );

        return;
    }


    try {

        const {
            response,
            data
        } = await apiRequest(
            "/rooms",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${loggedInUser.token}`
                }
            }
        );


        if (!response.ok) {

            console.error(
                "Unable to load rooms:",
                data
            );

            return;
        }


        const rooms =
            data || [];


        const select =
            document.getElementById(
                "roomSelect"
            );


        select.innerHTML = "";


        if (rooms.length === 0) {

            select.innerHTML = `
                <option value="">
                    No rooms available
                </option>
            `;


            currentRoomId =
                null;


            updateRoomInfo();

            return;
        }


        rooms.forEach(
            room => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    room.id;


                option.textContent =
                    `${room.id} - ${room.name}`;


                select.appendChild(
                    option
                );

            }
        );


        // -----------------------------------------------------
        // Keep current room if possible
        // -----------------------------------------------------

        if (
            currentRoomId &&
            rooms.some(
                room =>
                    room.id ===
                    Number(currentRoomId)
            )
        ) {

            select.value =
                currentRoomId;

        } else {

            currentRoomId =
                rooms[0].id;

            select.value =
                currentRoomId;
        }


        updateRoomInfo();


        // -----------------------------------------------------
        // Join/connect logged-in users
        // -----------------------------------------------------

        for (
            const userNumber of [1, 2]
        ) {

            if (
                users[userNumber].token
            ) {

                await joinCurrentRoom(
                    userNumber
                );


                await connectWebSocket(
                    userNumber
                );
            }
        }


        await loadMessages();

    } catch (error) {

        console.error(
            "Refresh rooms error:",
            error
        );
    }

}


// =============================================================
// CHANGE ROOM
// =============================================================

async function changeRoom() {

    const select =
        document.getElementById(
            "roomSelect"
        );


    currentRoomId =
        Number(select.value);


    if (!currentRoomId) {

        updateRoomInfo();

        return;
    }


    // ---------------------------------------------------------
    // Close existing WebSockets
    // ---------------------------------------------------------

    for (
        const userNumber of [1, 2]
    ) {

        if (
            users[userNumber].websocket
        ) {

            try {

                users[userNumber]
                    .websocket
                    .close();

            } catch (error) {

                console.error(
                    error
                );
            }


            users[userNumber]
                .websocket = null;
        }

    }


    displayedMessages.clear();


    document
        .getElementById(
            "messages"
        )
        .innerHTML = "";


    updateRoomInfo();


    // ---------------------------------------------------------
    // Join/connect logged-in users
    // ---------------------------------------------------------

    for (
        const userNumber of [1, 2]
    ) {

        if (
            users[userNumber].token
        ) {

            await joinCurrentRoom(
                userNumber
            );


            await connectWebSocket(
                userNumber
            );
        }

    }


    await loadMessages();

}


// =============================================================
// JOIN ROOM
// =============================================================

async function joinCurrentRoom(
    userNumber
) {

    const user =
        users[userNumber];


    if (
        !user.token ||
        !currentRoomId
    ) {

        return;
    }


    try {

        const {
            response,
            data
        } = await apiRequest(
            `/rooms/${currentRoomId}/join`,
            {
                method: "POST",

                headers: {
                    "Authorization":
                        `Bearer ${user.token}`
                }
            }
        );


        if (!response.ok) {

            console.error(
                `User ${userNumber} failed to join room:`,
                data
            );

            return;
        }


        console.log(
            `User ${userNumber} joined room ${currentRoomId}.`
        );

    } catch (error) {

        console.error(
            "Join room error:",
            error
        );
    }

}


// =============================================================
// LOAD MESSAGE HISTORY
// =============================================================

async function loadMessages() {

    const loggedInUser =
        getFirstLoggedInUser();


    if (
        !loggedInUser ||
        !currentRoomId
    ) {

        return;
    }


    try {

        const {
            response,
            data
        } = await apiRequest(
            `/rooms/${currentRoomId}/messages`,
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${loggedInUser.token}`
                }
            }
        );


        if (!response.ok) {

            console.error(
                "Unable to load messages:",
                data
            );

            return;
        }


        const messages =
            data || [];


        displayedMessages.clear();


        document
            .getElementById(
                "messages"
            )
            .innerHTML = "";


        messages.forEach(
            message => {

                addMessage(
                    message.sender_id,
                    message.content,
                    message.id
                );

            }
        );

    } catch (error) {

        console.error(
            "Load messages error:",
            error
        );
    }

}


// =============================================================
// CONNECT WEBSOCKET
// =============================================================

async function connectWebSocket(
    userNumber
) {

    const user =
        users[userNumber];


    if (
        !user.token ||
        !currentRoomId
    ) {

        return;
    }


    // ---------------------------------------------------------
    // Close previous connection
    // ---------------------------------------------------------

    if (user.websocket) {

        try {

            user.websocket.close();

        } catch (error) {

            console.error(
                error
            );
        }

        user.websocket = null;
    }


    /*
     * Local development:
     *
     * FastAPI:
     * http://127.0.0.1:8000
     *
     * WebSocket:
     * ws://127.0.0.1:8000
     */

    const wsUrl =
        `ws://127.0.0.1:8000` +
        `/ws/rooms/${currentRoomId}` +
        `?token=${encodeURIComponent(user.token)}`;


    console.log(
        `Connecting User ${userNumber} WebSocket:`,
        wsUrl
    );


    const websocket =
        new WebSocket(
            wsUrl
        );


    user.websocket =
        websocket;


    // ---------------------------------------------------------
    // WebSocket OPEN
    // ---------------------------------------------------------

    websocket.onopen =
        function () {

            console.log(
                `User ${userNumber} WebSocket connected.`
            );


            const status =
                document.getElementById(
                    `status${userNumber}`
                );


            status.textContent =
                `Connected to room ${currentRoomId}`;


            status.className =
                "status connected";
        };


    // ---------------------------------------------------------
    // WebSocket MESSAGE
    // ---------------------------------------------------------

    websocket.onmessage =
        function (event) {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                console.log(
                    "WebSocket message:",
                    data
                );


                if (
                    data.type ===
                    "error"
                ) {

                    console.error(
                        data.message
                    );

                    return;
                }


                addMessage(
                    data.sender_id,
                    data.content,
                    data.id
                );

            } catch (error) {

                console.error(
                    "WebSocket message error:",
                    error
                );
            }

        };


    // ---------------------------------------------------------
    // WebSocket CLOSE
    // ---------------------------------------------------------

    websocket.onclose =
        function (event) {

            console.log(
                `User ${userNumber} WebSocket disconnected.`,
                event.code,
                event.reason
            );


            const status =
                document.getElementById(
                    `status${userNumber}`
                );


            status.textContent =
                "Disconnected";


            status.className =
                "status disconnected";
        };


    // ---------------------------------------------------------
    // WebSocket ERROR
    // ---------------------------------------------------------

    websocket.onerror =
        function (error) {

            console.error(
                `User ${userNumber} WebSocket error:`,
                error
            );

        };

}


// =============================================================
// ADD MESSAGE
// =============================================================

function addMessage(
    senderId,
    content,
    messageId
) {

    // ---------------------------------------------------------
    // Prevent duplicates
    // ---------------------------------------------------------

    if (
        messageId !== undefined &&
        messageId !== null
    ) {

        const key =
            String(messageId);


        if (
            displayedMessages.has(key)
        ) {

            return;
        }


        displayedMessages.add(
            key
        );
    }


    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    const senderInfo =
        getSenderDisplayName(
            Number(senderId)
        );


    const strong =
        document.createElement(
            "strong"
        );


    strong.textContent =
        `${senderInfo}:`;


    div.appendChild(
        strong
    );


    div.appendChild(
        document.createTextNode(
            ` ${content}`
        )
    );


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


// =============================================================
// GET SENDER DISPLAY NAME
// =============================================================

function getSenderDisplayName(
    senderId
) {

    for (
        const userNumber of [1, 2]
    ) {

        const user =
            users[userNumber];


        if (
            user.userId ===
            senderId
        ) {

            return (
                `User ${userNumber} ` +
                `(${user.username})`
            );
        }

    }


    return `User ID ${senderId}`;

}


// =============================================================
// SEND MESSAGE
// =============================================================

function sendMessage() {

    const sendAs =
        document
            .getElementById(
                "sendAsUser"
            )
            .value;


    const input =
        document
            .getElementById(
                "messageInput"
            );


    const content =
        input.value.trim();


    if (!sendAs) {

        alert(
            "Please select a user."
        );

        return;
    }


    if (!content) {

        return;
    }


    const userNumber =
        Number(sendAs);


    const user =
        users[userNumber];


    if (
        !user.token ||
        !user.websocket
    ) {

        alert(
            `User ${userNumber} is not connected.`
        );

        return;
    }


    if (
        user.websocket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            `User ${userNumber} WebSocket is not connected.`
        );

        return;
    }


    user.websocket.send(
        JSON.stringify({
            type: "message",
            content: content
        })
    );


    input.value = "";

    input.focus();

}


// =============================================================
// ENTER KEY
// =============================================================

function handleMessageKey(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();
    }

}


// =============================================================
// CREATE ROOM
// =============================================================

async function createRoom() {

    // Only User 1 creates rooms.

    const user =
        users[1];


    if (!user.token) {

        alert(
            "User 1 must be logged in to create a room."
        );

        return;
    }


    const input =
        document.getElementById(
            "newRoomName"
        );


    const roomName =
        input.value.trim();


    if (!roomName) {

        alert(
            "Please enter a room name."
        );

        return;
    }


    try {

        const {
            response,
            data
        } = await apiRequest(
            "/rooms",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${user.token}`
                },

                body: JSON.stringify({
                    name: roomName
                })
            }
        );


        if (!response.ok) {

            alert(
                data?.detail ||
                "Unable to create room."
            );

            return;
        }


        input.value = "";


        currentRoomId =
            data.id;


        await refreshRooms();


        const select =
            document.getElementById(
                "roomSelect"
            );


        select.value =
            currentRoomId;


        await changeRoom();

    } catch (error) {

        console.error(
            "Create room error:",
            error
        );


        alert(
            `Unable to create room.\n\n${error.message}`
        );
    }

}


// =============================================================
// ROOM INFO
// =============================================================

function updateRoomInfo() {

    const info =
        document.getElementById(
            "roomInfo"
        );


    if (!currentRoomId) {

        info.textContent =
            "No room selected";

        return;
    }


    const select =
        document.getElementById(
            "roomSelect"
        );


    const option =
        select.options[
            select.selectedIndex
        ];


    if (option) {

        info.textContent =
            `Current room: ${option.textContent}`;

    } else {

        info.textContent =
            `Current room: ${currentRoomId}`;
    }

}


// =============================================================
// GET FIRST LOGGED-IN USER
// =============================================================

function getFirstLoggedInUser() {

    if (
        users[1].token
    ) {

        return users[1];
    }


    if (
        users[2].token
    ) {

        return users[2];
    }


    return null;

}


// =============================================================
// INITIAL PAGE STATE
// =============================================================

function initializePage() {

    // ---------------------------------------------------------
    // User 1
    // ---------------------------------------------------------

    document
        .getElementById(
            "loginView1"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "loggedInView1"
        )
        .style.display =
        "none";


    // ---------------------------------------------------------
    // User 2
    // ---------------------------------------------------------

    document
        .getElementById(
            "loginView2"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "loggedInView2"
        )
        .style.display =
        "none";


    updateSendUserOptions();


    checkServerConnection();


    console.log(
        "Messaging application initialized."
    );

}


// =============================================================
// START APPLICATION
// =============================================================

initializePage();

</script>
